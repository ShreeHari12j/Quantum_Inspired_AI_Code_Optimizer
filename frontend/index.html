<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Inspired AI Code Optimizer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#0f172a;
            color:white;
            font-family:Arial,Helvetica,sans-serif;
        }

        .main-card{
            max-width:1000px;
            margin:40px auto;
            background:#1e293b;
            border-radius:15px;
            padding:30px;
            box-shadow:0 0 15px rgba(0,0,0,.4);
        }

        h1{
            text-align:center;
            color:#38bdf8;
            font-weight:bold;
        }

        p{
            text-align:center;
            color:#cbd5e1;
        }

        label{
            font-weight:bold;
            margin-top:15px;
        }

        textarea{
            height:250px;
            resize:none;
        }

        .btn-custom{
            width:100%;
            margin-top:25px;
            font-size:20px;
        }

        #pasteSection{
            display:none;
        }

        .radio-group{
            margin-top:20px;
            margin-bottom:20px;
        }
    </style>

</head>
<body>

<div class="container">

<div class="main-card">

<h1>Quantum Inspired AI Code Optimizer</h1>

<p>AI + Quantum Inspired Search Powered Code Optimization</p>

<hr>

<h4>Input Method</h4>

<div class="radio-group">

<input type="radio"
name="method"
checked
onclick="uploadMode()">

Upload File

&nbsp;&nbsp;&nbsp;&nbsp;

<input type="radio"
name="method"
onclick="pasteMode()">

Paste Code

</div>

<div id="uploadSection">

<label>Select Source Code File</label>

<input
type="file"
class="form-control"
accept=".c,.cpp,.java,.py">

<small>
Supported :
C, C++, Java, Python
</small>

</div>

<div id="pasteSection">

<label>Paste Source Code</label>

<textarea
class="form-control"
placeholder="Paste your source code here..."></textarea>

</div>

<label>Prompt</label>

<input
type="text"
class="form-control"
placeholder="Example : Optimize this code in Java">

<label>Output Language</label>

<select class="form-select">

<option>Same as Input</option>

<option>C</option>

<option>C++</option>

<option>Java</option>

<option>Python</option>

<option>Multiple Languages</option>

</select>

<label>Optimization Level</label>

<select class="form-select">

<option>Fast</option>

<option selected>Balanced</option>

<option>Maximum Optimization</option>

</select>

<button class="btn btn-primary btn-custom">

Analyze Code

</button>

</div>

</div>

<script>

function uploadMode(){

document.getElementById("uploadSection").style.display="block";
document.getElementById("pasteSection").style.display="none";

}

function pasteMode(){

document.getElementById("uploadSection").style.display="none";
document.getElementById("pasteSection").style.display="block";

}

</script>

</body>
</html>
